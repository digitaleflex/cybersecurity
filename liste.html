<body class="app" data-page="shared">

  <div class="scrim" id="scrim" hidden></div>

    <aside class="sidebar" id="sidebar" aria-label="Navigation latérale"></aside>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>

        <section class="page-head" aria-labelledby="sharedTitle">
