name: Signaler un lien cassé
description: Un lien du catalogue ne fonctionne plus ou a changé d'adresse.
title: "[Lien] "
labels: ["broken-link"]
body:
  - type: input
    id: resource
    attributes:
      label: Ressource concernée
      description: Nom ou identifiant (visible dans l'adresse de la fiche).
      placeholder: Nom de la ressource
    validations:
      required: true
  - type: input
    id: old_url
    attributes:
      label: Adresse qui ne fonctionne pas
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: new_url
    attributes:
      label: Nouvelle adresse (si tu la connais)
      placeholder: https://...
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Ce que tu constates
      description: Erreur 404, site disparu, redirection vers un autre site, certificat invalide…
    validations:
      required: false
