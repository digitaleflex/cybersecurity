name: Proposer une ressource
description: Propose une ressource pour HashCode Cyber Library (le plus simple : utilise le formulaire de la page Contribuer du site, il remplit ce ticket pour toi).
title: "[Ressource] "
labels: ["resource-review"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de proposer une ressource ! Le lien doit pointer vers l'éditeur, l'auteur ou le dépôt **original**. Les ressources offensives doivent viser des tests autorisés ou des environnements de formation contrôlés.
        Astuce : le formulaire de la page **Contribuer** du site détecte les doublons avant l'envoi.
  - type: input
    id: resource_title
    attributes:
      label: Nom de la ressource
      placeholder: Nom officiel du projet ou de la ressource
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Adresse officielle (https)
      placeholder: https://...
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domaine
      options:
        - Fundamentals
        - OSINT
        - Red Team
        - Blue Team
        - Reverse Engineering
        - Malware Analysis
        - Cloud Security
        - Application Security
        - CTF & Labs
        - Courses & Books
        - Communities
        - Research & Reports
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Outil
        - Formation
        - Laboratoire
        - Documentation
        - Dépôt GitHub
        - Framework
        - Plateforme
        - Communauté
        - Rapport
        - Bibliothèque
        - Annuaire
        - Base de données
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Niveau
      options:
        - Débutant
        - Intermédiaire
        - Avancé
        - Professionnel
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: Accès
      options:
        - Gratuit
        - Freemium
        - Payant
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Langue du contenu
      options:
        - Français
        - Anglais
        - Multilingue
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Catégorie
      description: Ex. Investigation, SIEM, GEOINT, Web Security…
      placeholder: Investigation
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: Mots-clés (séparés par des virgules)
      placeholder: osint, verification
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Que fournit cette ressource ?
      description: 40 à 220 caractères, factuel, sans promotion.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Pourquoi l'inclure ?
      description: Documentation officielle, preuve de maintenance, exemple d'usage utile.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Usage responsable
      options:
        - label: J'ai vérifié que cette ressource ne promeut ni accès non autorisé, ni doxxing, ni vol d'identifiants, ni diffusion de données volées.
          required: true
