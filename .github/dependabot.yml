# Mises à jour automatiques : actions GitHub de la CI et outils de développement (tests, linter).
# Aucune dépendance n'est utilisée en production : le site n'a rien à installer pour démarrer.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dev-tools:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
